<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Hacked by ZeTi — Don't hate the hacker. hate the code.">
  <title>Hacked by ZeTi</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      margin: 0;
      padding: clamp(24px, 4svh, 64px) 16px;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin: 0 0 clamp(18px, 2.7svh, 32px);
      font-size: clamp(28px, 4svh, 44px);
      font-weight: 400;
      line-height: 1.2;
    }
    figure {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(61.5svh, 664px, calc(100vw - 32px));
      aspect-ratio: 664 / 628;
      margin: 0;
      overflow: hidden;
      border: 0;
      background: #000;
    }
    figure img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .quote {
      margin: clamp(19px, 2.2svh, 28px) 0 0;
      font-size: clamp(22px, 3.8svh, 42px);
      font-weight: 400;
      line-height: 1.65;
    }
    .quote span { display: block; }
    .email {
      margin: clamp(13px, 1.6svh, 20px) 0 0;
      font-size: clamp(22px, 3.8svh, 42px);
      line-height: 1.2;
    }
    .email a { color: inherit; text-decoration: none; }
    .email a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .email a:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>Hacked by ZeTi</h1>
    <figure>
      <img src="33282_16559_2453.jpg" alt="The Scream artwork" width="630" height="1044">
    </figure>
    <p class="quote"><span>Don't hate the hacker.</span><span>hate the code.</span></p>
    <p class="email"><a href="mailto:zeti404@nol.com">zeti404@nol.com</a></p>
  </main>
</body>
</html>
